<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buscador de palabras</title>
</head>
<body>
  <main class="contenedor">
    <h1>Buscador de palabras</h1>

    <div id="alerta" class="alerta oculto"></div>

    <label for="texto">Texto</label>
    <textarea id="texto" rows="8" placeholder="Escribe o pega tu texto aquí..."></textarea>

    <label for="palabra">Palabra o carácter a buscar</label>
    <input id="palabra" type="text" placeholder="Ej. casa">

    <div class="botones">
      <button id="btnBuscar" class="btn btn-primario">Buscar</button>
      <button id="btnLimpiar" class="btn btn-secundario">Limpiar</button>
    </div>

    <p class="contador">Veces encontrada: <strong id="contador">0</strong></p>

    <h2>Texto procesado</h2>
    <div id="resultado" class="resultado"></div>
  </main>
</body>
</html>
